name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install black==26.3.1 mypy
      - name: Check formatting
        run: black --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install black==26.3.1 mypy
      - name: Type check
        run: mypy . --ignore-missing-imports || true

  # Track 2 — LLM gateway integration tests.
  # Two tiers:
  #   1. Static (no Docker): source-has-no-provider-keys + legacy-unchanged.
  #      Always runs, including on fork PRs (no secret required).
  #   2. Full stack (Docker Compose + real provider call): boots
  #      docker-compose.local.yml, runs every test. Requires
  #      ANTHROPIC_API_KEY secret. Gated so fork PRs skip it gracefully.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # test_legacy_agents_unchanged runs `git diff main` — need full history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest requests pyyaml

      - name: Detect provider secret
        id: secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY secret not set — running static test subset only."
          fi

      # ------- Full-stack path (only when we have a real provider key) -------
      - name: Prepare .nasiko-local.env
        if: steps.secret.outputs.has == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp .nasiko-local.env.example .nasiko-local.env
          # Overlay the real provider key + a CI-specific virtual key.
          sed -i "s|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}|" .nasiko-local.env
          sed -i "s|^LITELLM_MASTER_KEY=.*|LITELLM_MASTER_KEY=sk-ci-virtual|" .nasiko-local.env

      - name: Boot local stack
        if: steps.secret.outputs.has == 'true'
        run: make compose-up

      - name: Wait for gateway + phoenix
        if: steps.secret.outputs.has == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4500/health/liveliness > /dev/null \
               && curl -sf http://localhost:6006/ > /dev/null; then
              echo "gateway + phoenix up"; exit 0
            fi
            sleep 3
          done
          echo "stack did not come up in time" >&2
          docker compose -f docker-compose.local.yml ps
          exit 1

      - name: Run integration tests (full)
        if: steps.secret.outputs.has == 'true'
        run: pytest tests/integration/ -v --maxfail=1

      - name: Dump container logs on failure
        if: failure() && steps.secret.outputs.has == 'true'
        run: |
          docker compose -f docker-compose.local.yml ps
          docker compose -f docker-compose.local.yml logs --tail=400

      # ------- Static-only path (fork PRs / missing secret) -------
      - name: Run integration tests (static subset)
        if: steps.secret.outputs.has != 'true'
        run: |
          pytest tests/integration/ -v \
            -k "test_demo_agent_source_has_no_provider_keys or test_legacy_agents_unchanged"
