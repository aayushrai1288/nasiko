model_list:
  # Primary: Anthropic Claude via direct Anthropic API
  - model_name: nasiko-default
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Alias for explicit opt-in
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Rotation target: mock OpenAI-compatible server for integration tests.
  # Swap `nasiko-default` above to this model to prove provider rotation
  # without agent code change (acceptance criterion #3).
  - model_name: mock-default
    litellm_params:
      model: openai/mock-model
      api_base: http://mock-llm:8080/v1
      api_key: sk-mock

litellm_settings:
  # OTEL export so gateway spans land in Phoenix alongside agent spans.
  # The gateway reads incoming `traceparent` headers and emits child spans.
  callbacks: ["otel"]
  success_callback: ["otel"]
  failure_callback: ["otel"]
  set_verbose: false
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
